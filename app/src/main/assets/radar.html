<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #060709; color: #fff; font-family: sans-serif; }
  #map { position: absolute; inset: 0 0 92px 0; background: #060709; }
  #panel { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; padding: 8px 14px;
           box-sizing: border-box; background: #0b0d10; border-top: 1px solid rgba(255,255,255,.2); }
  #row { display: flex; align-items: center; gap: 12px; }
  #play { width: 44px; height: 44px; border-radius: 22px; border: 0; background: #ffd54f; color: #060709;
          font-size: 20px; font-weight: bold; }
  #time { font-size: 18px; color: #cfe3ff; font-family: sans-serif-condensed, sans-serif; min-width: 110px; }
  #slider { flex: 1; accent-color: #ffd54f; }
  #attr { font-size: 10px; color: rgba(255,255,255,.6); margin-top: 6px; }
  #attr a { color: rgba(255,255,255,.8); }
  #msg { position: absolute; top: 40%; width: 100%; text-align: center; color: rgba(255,255,255,.7); z-index: 999; }
  .leaflet-control-attribution { display: none; }
  .pin { width: 14px; height: 14px; border-radius: 7px; background: #ffd54f; border: 2px solid #060709;
         box-shadow: 0 0 0 2px #ffd54f; }
</style>
</head>
<body>
<div id="map"></div>
<div id="msg">Načítám radar…</div>
<div id="panel">
  <div id="row">
    <button id="play">▶</button>
    <div id="time">--:--</div>
    <input id="slider" type="range" min="0" max="0" value="0">
  </div>
  <div id="attr">Radar: <a href="https://www.rainviewer.com/">Weather data by RainViewer</a> ·
    Mapa: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a></div>
</div>
<script>
  var lat = parseFloat('__LAT__'), lon = parseFloat('__LON__'), placeName = '__NAME__';
  var msg = document.getElementById('msg');

  if (typeof L === 'undefined') {
    msg.textContent = 'Mapu se nepodařilo načíst – zkontroluj připojení.';
  } else {
    var map = L.map('map', { zoomControl: true, attributionControl: false }).setView([lat, lon], 7);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 12
    }).addTo(map);
    L.marker([lat, lon], { icon: L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [18, 18] }) })
      .addTo(map).bindTooltip(placeName || 'Stanice');

    var host = '', frames = [], layers = {}, idx = 0, timer = null;
    var slider = document.getElementById('slider'), timeEl = document.getElementById('time'),
        playBtn = document.getElementById('play');

    function layerFor(f) {
      if (!layers[f.path]) {
        // bezplatné API: max. přiblížení 7, barevné schéma 2 (Universal Blue), vyhlazení, sníh
        layers[f.path] = L.tileLayer(host + f.path + '/256/{z}/{x}/{y}/2/1_1.png', {
          opacity: 0, maxNativeZoom: 7, maxZoom: 12, tileSize: 256, zIndex: 10
        }).addTo(map);
      }
      return layers[f.path];
    }

    function show(i) {
      if (!frames.length) return;
      idx = (i + frames.length) % frames.length;
      frames.forEach(function (f, j) { if (layers[f.path]) layers[f.path].setOpacity(j === idx ? 0.75 : 0); });
      layerFor(frames[idx]).setOpacity(0.75);
      // přednačíst další snímek
      layerFor(frames[(idx + 1) % frames.length]);
      var d = new Date(frames[idx].time * 1000);
      timeEl.textContent = d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }) +
        (idx === frames.length - 1 ? ' (teď)' : '');
      slider.value = idx;
    }

    function stop() { if (timer) { clearInterval(timer); timer = null; } playBtn.textContent = '▶'; }
    function play() {
      stop();
      playBtn.textContent = '❚❚';
      timer = setInterval(function () { show(idx + 1); }, 600);
    }
    playBtn.onclick = function () { timer ? stop() : play(); };
    slider.oninput = function () { stop(); show(parseInt(slider.value, 10)); };

    window.reloadFrames = function () {
      fetch('https://api.rainviewer.com/public/weather-maps.json')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          host = data.host;
          frames = (data.radar && data.radar.past) ? data.radar.past : [];
          Object.keys(layers).forEach(function (k) { map.removeLayer(layers[k]); });
          layers = {};
          slider.max = Math.max(0, frames.length - 1);
          msg.style.display = frames.length ? 'none' : 'block';
          if (!frames.length) msg.textContent = 'Radarová data nejsou k dispozici.';
          stop();
          show(frames.length - 1);
        })
        .catch(function () { msg.style.display = 'block'; msg.textContent = 'Radar se nepodařilo načíst.'; });
    };
    reloadFrames();
    // obnovovat každých 5 minut
    setInterval(window.reloadFrames, 5 * 60 * 1000);
  }
</script>
</body>
</html>
